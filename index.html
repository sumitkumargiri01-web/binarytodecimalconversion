<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary to Decimal Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
            text-align: center;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 200px;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Binary to Decimal Converter</h1>
    <p>Enter a binary number (e.g., 1010) and click Convert.</p>
    <input type="text" id="binaryInput" placeholder="Enter binary number">
    <button onclick="convert()">Convert</button>
    <div id="result"></div>

    <script>
        function convert() {
            const binary = document.getElementById('binaryInput').value;
            const resultDiv = document.getElementById('result');
            
            // Validate input: only 0s and 1s
            if (!/^[01]+$/.test(binary)) {
                resultDiv.innerHTML = 'Error: Please enter a valid binary number (only 0s and 1s).';
                return;
            }
            
            // Convert binary to decimal
            const decimal = parseInt(binary, 2);
            resultDiv.innerHTML = `Decimal: ${decimal}`;
        }
    </script>
</body>
</html>
